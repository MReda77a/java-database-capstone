<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Clinic - Doctor Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Smart Clinic <span>Doctor Portal</span></div>
    <button class="link" onclick="logout()">Logout</button>
  </header>

  <main>
    <h1>My Patient Appointments</h1>
    <p class="sub">All upcoming appointments, soonest first.</p>

    <div class="card">
      <table>
        <thead>
          <tr><th>#</th><th>Patient</th><th>Phone</th><th>Date &amp; time</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>You have no appointments.</div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    if (requireRole('doctor')) {
      loadAppointments();
    }

    async function loadAppointments() {
      const result = await getJson('/appointment/doctor/' + getToken());

      if (result.status === 401) {
        logout();
        return;
      }

      const list = result.ok && result.data ? result.data : [];
      document.getElementById('rows').innerHTML = list.map((a, i) =>
        '<tr><td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(a.patientName) + '</td>' +
        '<td>' + escapeHtml(a.patientPhone) + '</td>' +
        '<td>' + escapeHtml(a.appointmentTime.replace('T', ' ')) + '</td>' +
        '<td class="status">' + escapeHtml(a.status) + '</td></tr>'
      ).join('');
      document.getElementById('emptyState').hidden = list.length > 0;
    }
  </script>
</body>
</html>
