spring.application.name=smart-clinic

# MySQL (override with environment variables in Docker / production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB (prescriptions)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/prescriptions}

# JWT signing secret (must be at least 32 characters; override in production)
jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-123456}
