<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Clinic Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Smart Clinic <span>Management System</span></div>
  </header>

  <main>
    <h1>Welcome to Smart Clinic</h1>
    <p class="sub">Choose your portal to continue.</p>

    <div class="roles">
      <a class="role" href="/login.html?role=admin">
        <div class="icon">&#128737;</div>
        <h2>Admin Portal</h2>
        <p>Manage doctors and the platform</p>
      </a>
      <a class="role" href="/login.html?role=doctor">
        <div class="icon">&#129658;</div>
        <h2>Doctor Portal</h2>
        <p>View and manage your appointments</p>
      </a>
      <a class="role" href="/login.html?role=patient">
        <div class="icon">&#129489;</div>
        <h2>Patient Portal</h2>
        <p>Find doctors and book appointments</p>
      </a>
    </div>
  </main>
</body>
</html>
